name: Android Static Analysis Agent
description: Run the agent against the checked-out Android application.
inputs:
  path:
    description: Path to the Android application in the CI workspace.
    required: false
    default: .
  run-tools:
    description: Run Gradle Lint/Detekt and installed Semgrep/Gitleaks binaries.
    required: false
    default: 'true'
  changed-only:
    description: Limit output to files changed by the last commit.
    required: false
    default: 'true'
  policy:
    description: Optional path to the Android application's policy JSON.
    required: false
    default: ''
  rules:
    description: Optional path to the Android application's additional or replacement rules JSON.
    required: false
    default: ''
  sarif-file:
    description: SARIF path relative to the Android application.
    required: false
    default: android-static-agent.sarif
  markdown-file:
    description: Markdown path relative to the Android application.
    required: false
    default: android-static-agent.md
  comment-file:
    description: Compact pull-request comment path relative to the Android application.
    required: false
    default: android-static-agent-comment.md
  repository-markdown-file:
    description: Whole-repository Markdown report path relative to the Android application.
    required: false
    default: android-static-agent-repository.md
  gemini-model:
    description: Optional Gemini model used to explain and assign confidence to findings.
    required: false
    default: ''
outputs:
  sarif-file:
    description: SARIF path relative to the Android application.
    value: ${{ inputs.sarif-file }}
  markdown-file:
    description: Markdown path relative to the Android application.
    value: ${{ inputs.markdown-file }}
  comment-file:
    description: Compact pull-request comment path relative to the Android application.
    value: ${{ inputs.comment-file }}
  repository-markdown-file:
    description: Whole-repository Markdown report path relative to the Android application.
    value: ${{ inputs.repository-markdown-file }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        APP_PATH: ${{ inputs.path }}
        POLICY_PATH: ${{ inputs.policy }}
        RULES_PATH: ${{ inputs.rules }}
        RUN_TOOLS: ${{ inputs.run-tools }}
        CHANGED_ONLY: ${{ inputs.changed-only }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        MARKDOWN_FILE: ${{ inputs.markdown-file }}
        COMMENT_FILE: ${{ inputs.comment-file }}
        REPOSITORY_MARKDOWN_FILE: ${{ inputs.repository-markdown-file }}
        GEMINI_MODEL: ${{ inputs.gemini-model }}
      run: |
        if [ -n "$GEMINI_MODEL" ]; then
          python -m pip install "${GITHUB_ACTION_PATH}[gemini]"
        else
          python -m pip install "$GITHUB_ACTION_PATH"
        fi
        source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}"
        args=("$APP_PATH" --format markdown --output "$APP_PATH/$MARKDOWN_FILE" --sarif "$APP_PATH/$SARIF_FILE" --pr-comment "$APP_PATH/$COMMENT_FILE" --source-url "$source_url")
        if [ "$RUN_TOOLS" = "true" ]; then args+=(--run-tools); fi
        if [ "$CHANGED_ONLY" = "true" ]; then args+=(--changed-only); fi
        if [ -n "$POLICY_PATH" ]; then args+=(--policy "$POLICY_PATH"); fi
        if [ -n "$RULES_PATH" ]; then args+=(--rules "$RULES_PATH"); fi
        if [ -n "$GEMINI_MODEL" ]; then args+=(--gemini-model "$GEMINI_MODEL"); fi
        set +e
        android-static-agent "${args[@]}"
        analysis_exit=$?
        set -e

        if [ "$CHANGED_ONLY" = "true" ]; then
          repository_args=("$APP_PATH" --format markdown --output "$APP_PATH/$REPOSITORY_MARKDOWN_FILE")
          if [ -n "$POLICY_PATH" ]; then repository_args+=(--policy "$POLICY_PATH"); fi
          if [ -n "$RULES_PATH" ]; then repository_args+=(--rules "$RULES_PATH"); fi
          set +e
          android-static-agent "${repository_args[@]}"
          set -e
        else
          cp "$APP_PATH/$MARKDOWN_FILE" "$APP_PATH/$REPOSITORY_MARKDOWN_FILE"
        fi
        exit "$analysis_exit"
