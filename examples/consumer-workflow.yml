# Copy to the Android application's .github/workflows/android-static-analysis.yml.
# Replace OWNER/REPOSITORY with this agent's repository and pin a release tag.
name: Android static analysis
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
  security-events: write
  pull-requests: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Install Gitleaks
        run: |
          export GOBIN="$RUNNER_TEMP/bin"
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Run Android static analysis
        id: analysis
        continue-on-error: true
        uses: OWNER/REPOSITORY@v1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          path: .
          run-tools: 'true'
          changed-only: 'false'
          gemini-model: gemini-3.5-flash-lite
      - name: Publish pull-request summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- android-static-analysis-agent -->';
            if (!fs.existsSync('android-static-agent-comment.md')) {
              core.warning('The analysis comment file was not produced.');
              return;
            }
            let body = fs.readFileSync('android-static-agent-comment.md', 'utf8');
            body += `\n\n[Open the detailed workflow report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Publish pushed-commit summary
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('android-static-agent-comment.md')) {
              core.warning('The analysis comment file was not produced.');
              return;
            }
            let body = fs.readFileSync('android-static-agent-comment.md', 'utf8');
            body += `\n\n[Open the detailed workflow report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });
      - name: Add report to the workflow summary
        if: always()
        run: |
          if [ -f android-static-agent-comment.md ]; then
            cat android-static-agent-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: android-static-agent.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-static-analysis
          path: |
            android-static-agent.sarif
            android-static-agent.md
            android-static-agent-comment.md
      - name: Enforce analysis policy
        if: steps.analysis.outcome == 'failure'
        run: exit 1
